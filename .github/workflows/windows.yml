name: Сборка редактора для Windows

# Собирает готовый SageEditor.exe и кладёт его в раздел Releases — чтобы
# посмотреть движок в деле можно было без установки компилятора и CMake.
#
# Когда запускается:
#   • при каждой правке в main — обновляет сборку «windows-latest»;
#   • по кнопке «Run workflow» на вкладке Actions — если сборка нужна сейчас;
#   • при теге вида v1.0 — делает отдельный релиз с этим номером.
on:
  push:
    # Не только main: рабочие ветки тоже собираются, иначе готовой программы
    # для скачивания не существует до слияния. Кнопка «Run workflow» на вкладке
    # Actions, к слову, показывается только для веток по умолчанию — на неё
    # рассчитывать нельзя.
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

# Нужно право записи: работа сама публикует релиз.
permissions:
  contents: write

jobs:
  windows:
    name: Windows (SageEditor.exe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка кросс-компилятора
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 ninja-build

      # Кросс-компиляция с Linux, а не сборка на windows-раннере: тулчейн
      # линкует рантайм СТАТИЧЕСКИ (cmake/mingw-toolchain.cmake), поэтому .exe
      # запускается на чистой Windows без установки Visual C++ Redistributable
      # и прочих библиотек. На windows-раннере с MSVC пришлось бы тащить эти
      # зависимости с собой.
      - name: Сборка
        run: |
          cmake -B build-windows -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/mingw-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-windows -j"$(nproc)"

      # Проверяем, что получился именно windows-исполняемый файл С ОКНОМ и что
      # ему не нужны посторонние DLL. Без этой проверки «сборка прошла» ничего
      # не значит: получить .exe, который на чистой Windows выдаст «отсутствует
      # libstdc++-6.dll», очень легко.
      - name: Проверка результата
        run: |
          EXE=build-windows/editor/SageEditor.exe
          test -f "$EXE" || { echo "::error::SageEditor.exe не собрался"; exit 1; }
          # Плеер и шаблоны — часть поставки, а не приятное дополнение: без
          # первого не работает Build Game, без вторых — шаблон «Витрина».
          test -f build-windows/runtime/SagePlayer.exe \
            || { echo "::error::SagePlayer.exe не собрался — Build Game работать не будет"; exit 1; }
          # Плеер — это КАЖДАЯ игра, собранная кнопкой Build Game. Он обязан
          # быть оконным приложением ровно по той же причине, что и редактор:
          # иначе игрок получает рядом с игрой чёрное окно консоли, закрыть
          # которое можно только вместе с игрой. Проверяется отдельно, потому
          # что подсистему задаёт хелпер sage_add_game, и потерять там один
          # флаг ничего не стоит — а заметит это игрок, а не сборка.
          file build-windows/runtime/SagePlayer.exe | grep -q "PE32+ executable (GUI)" \
            || { echo "::error::SagePlayer.exe консольный — у игр будет лишнее окно терминала"; exit 1; }
          test -f build-windows/editor/templates/showcase/project.sageproj \
            || { echo "::error::шаблон-витрина не скопировался в templates/"; exit 1; }
          # Шрифт движка — тоже часть поставки. Без него UIRenderer молча
          # перебирает системные шрифты: на Windows находит Segoe UI, и дефект
          # не виден, а на машине без него текст падает на stb_easy_font, то
          # есть теряет кириллицу целиком. Проверять надо именно наличие файла:
          # «редактор запустился и текст был» этот случай не ловит — он ровно
          # так и выглядел.
          test -f build-windows/editor/assets/fonts/sage-default.ttf \
            || { echo "::error::шрифт движка не попал к редактору — без системного шрифта интерфейс останется без кириллицы"; exit 1; }
          # Командная строка — тоже часть поставки. Движком пользуются двумя
          # способами, и второй (проект создаётся кодом, редактор открывает его
          # как есть) скачавшему недоступен, если в архиве лежит только
          # редактор: собирать движок из исходников ради `sage project create`
          # никто не станет.
          test -f build-windows/tools/sage_cli/sage.exe \
            || { echo "::error::sage.exe не собрался — работа без редактора недоступна"; exit 1; }
          file "$EXE"
          file "$EXE" | grep -q "PE32+ executable (GUI)" \
            || { echo "::error::Это не оконное windows-приложение"; exit 1; }

          # Список разрешённых DLL — это список того, что ЕСТЬ НА ЧИСТОЙ WINDOWS.
          # Он не декоративный: mingw охотно линкует свои libstdc++/libgcc, и
          # собранный так exe не запускается ни у кого, кроме собравшего.
          # dbghelp.dll добавлена вместе с обработчиком падений — она системная
          # (Debug Help Library, лежит в System32 со времён XP) и нужна, чтобы
          # отчёт о падении содержал имена функций, а не голые адреса.
          DLLS=$(x86_64-w64-mingw32-objdump -p "$EXE" | grep "DLL Name" | awk '{print tolower($3)}' | sort -u)
          echo "SageEditor.exe требует DLL:"; echo "$DLLS"
          for dll in $DLLS; do
            case "$dll" in
              kernel32.dll|user32.dll|gdi32.dll|shell32.dll|msvcrt.dll|advapi32.dll|ole32.dll|winmm.dll|ws2_32.dll|opengl32.dll|imm32.dll|setupapi.dll|version.dll|dwmapi.dll|comdlg32.dll|oleaut32.dll|uuid.dll|bcrypt.dll|winspool.dll|dbghelp.dll)
                ;;
              *)
                echo "::error::SageEditor.exe просит постороннюю библиотеку $dll — на чистой Windows не запустится"
                exit 1 ;;
            esac
          done

          # Плагин-пример (editor/plugins/example_stats.dll) — ЕДИНСТВЕННЫЙ
          # компонент архива с динамическим рантаймом: он линкуется на
          # import-библиотеку SageEditor.exe, чтобы резолвить символы ImGui::,
          # а тот .exe уже несёт статический рантайм — второй статической копии
          # компоновщик не даёт (см. комментарий в cmake/mingw-toolchain.cmake).
          # Поэтому здесь мы не запрещаем libstdc++-6.dll, а проверяем, что
          # больше ничего постороннего плагин не просит, и кладём эту dll рядом
          # в шаге упаковки.
          PLUGIN=build-windows/editor/plugins/example_stats.dll
          if [ -f "$PLUGIN" ]; then
            PLUGIN_DLLS=$(x86_64-w64-mingw32-objdump -p "$PLUGIN" | grep "DLL Name" | awk '{print tolower($3)}' | sort -u)
            echo "example_stats.dll требует DLL:"; echo "$PLUGIN_DLLS"
            for dll in $PLUGIN_DLLS; do
              case "$dll" in
                kernel32.dll|user32.dll|gdi32.dll|shell32.dll|msvcrt.dll|advapi32.dll|ole32.dll|winmm.dll|ws2_32.dll|opengl32.dll|imm32.dll|setupapi.dll|version.dll|dwmapi.dll|comdlg32.dll|oleaut32.dll|uuid.dll|bcrypt.dll|winspool.dll|dbghelp.dll|libstdc++-6.dll|sageeditor.exe)
                  ;;
                *)
                  echo "::error::example_stats.dll просит незнакомую библиотеку $dll"
                  exit 1 ;;
              esac
            done
          fi

      - name: Сборка архива
        run: |
          PKG=SageEditor-Windows
          mkdir -p "$PKG"
          cp build-windows/editor/SageEditor.exe "$PKG"/
          cp -r build-windows/editor/assets "$PKG"/assets

          # ПЛЕЕР — ВМЕСТЕ С РЕДАКТОРОМ, в подпапку runtime/.
          #
          # Без него File > Build Game в скачанном редакторе отказывала: собрать
          # игру нечем, потому что собирать её и значит «положить рядом с
          # проектом SagePlayer». Подпапка, а не корень архива, потому что
          # сборка копирует в игру ассеты ИЗ ПАПКИ ПЛЕЕРА (шейдеры рантайма) —
          # лёжа в корне, он утащил бы туда ассеты редактора.
          mkdir -p "$PKG/runtime"
          cp build-windows/runtime/SagePlayer.exe "$PKG/runtime/"
          cp -r build-windows/runtime/assets "$PKG/runtime/assets"

          # КОМАНДНАЯ СТРОКА — в корень архива, рядом с редактором: её набирают
          # руками, и путь вида tools/sage_cli/sage.exe этому мешает. Своих
          # ассетов у неё нет (ни окна, ни OpenGL), утащить чужие она не может.
          cp build-windows/tools/sage_cli/sage.exe "$PKG"/

          # Готовые проекты-шаблоны (templates/<id>): без них «Витрина» в окне
          # создания проекта честно объявляет себя недоступной — то есть пункт
          # есть, а нажать его нельзя.
          if [ -d build-windows/editor/templates ]; then
            cp -r build-windows/editor/templates "$PKG/templates"
          fi

          # Плагин-пример вместе с рантайм-DLL, которого требует именно он (см.
          # шаг проверки выше) — кладём рядом с SageEditor.exe: без явного
          # SetDllDirectory загрузчик Windows ищет зависимости плагина в
          # каталоге ГЛАВНОГО процесса, а не в plugins/.
          if [ -f build-windows/editor/plugins/example_stats.dll ]; then
            mkdir -p "$PKG/plugins"
            cp build-windows/editor/plugins/example_stats.dll "$PKG/plugins/"
            cp "$(x86_64-w64-mingw32-g++ -print-file-name=libstdc++-6.dll)" "$PKG/"
          fi

          cp docs/README-windows.txt "$PKG"/README.txt
          zip -r "$PKG.zip" "$PKG" >/dev/null
          ls -la "$PKG.zip"

      - name: Загрузить архив (вкладка Actions)
        uses: actions/upload-artifact@v4
        with:
          name: SageEditor-Windows
          path: SageEditor-Windows.zip

      # Релиз — чтобы ссылка на скачивание была постоянной и лежала на главной
      # странице репозитория. Заходить на вкладку Actions и искать сборку не
      # нужно.
      # СКОЛЬЗЯЩИЙ РЕЛИЗ ПУБЛИКУЕТСЯ ТОЛЬКО С main (и по тегу).
      #
      # Раньше его перезаписывала ЛЮБАЯ ветка, включая резервные
      # (claude/backup-main-*) — то есть заведомо СТАРОЕ состояние. Работы идут
      # параллельно и заканчиваются в произвольном порядке, поэтому «последняя
      # сборка» доставалась той, что финишировала последней, а не той, что
      # новее. Человек скачивал «свежий» редактор и получал вчерашний — и все
      # исправления, которые он ждал, в нём отсутствовали.
      #
      # Рабочие ветки по-прежнему собираются: архив лежит артефактом на вкладке
      # Actions, и скачать сборку ветки можно. Публичную ссылку он не трогает.
      - name: Опубликовать в Releases
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # А ЭТА СБОРКА ЕЩЁ САМАЯ СВЕЖАЯ? Публикация «только с main» гонку не
          # закрывает: два слияния подряд дают две работы, и та, что стартовала
          # раньше, вполне может финишировать позже — тогда она затрёт релиз
          # СТАРЫМ архивом. Сравниваем свой коммит с текущей вершиной main и
          # молча уступаем дорогу более новой сборке.
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            HEAD_NOW="$(gh api repos/${{ github.repository }}/commits/main --jq .sha)"
            if [[ -n "$HEAD_NOW" && "$HEAD_NOW" != "${{ github.sha }}" ]]; then
              echo "main уже ушёл вперёд ($HEAD_NOW), релиз выложит более свежая сборка"
              exit 0
            fi
          fi

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="SAGE Editor $TAG"
          else
            TAG="windows-latest"
            TITLE="SAGE Editor — последняя сборка для Windows"
            # Скользящий релиз: старый удаляем, чтобы ссылка всегда вела на
            # свежую версию, а список релизов не зарастал.
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          fi
          # ЧТО ИМЕННО в архиве — в описании релиза. Без этого «свежая сборка»
          # проверяется только на слово: у скачавшего нет способа отличить
          # сегодняшнюю от недельной, и разбор любой жалобы начинается с
          # вопроса «а какая у вас версия?».
          SUBJECT="$(git log -1 --pretty=%s)"
          WHEN="$(git log -1 --date=format:'%d.%m.%Y %H:%M' --pretty=%cd)"
          SHORT="$(git rev-parse --short HEAD)"
          gh release create "$TAG" SageEditor-Windows.zip \
            --title "$TITLE" \
            --notes "$(printf '%s\n\n%s\n\n%s\n%s\n%s' \
              'Скачайте SageEditor-Windows.zip, распакуйте папку целиком и запустите SageEditor.exe. Устанавливать ничего не нужно.' \
              'В архиве: редактор, плеер (runtime/), командная строка sage.exe, шаблоны проектов и плагин-пример.' \
              "Собрано из: $SHORT — $SUBJECT" \
              "Дата коммита: $WHEN" \
              'Если что-то не запускается — рядом с exe появляется sage_editor.log, в нём написана причина.')"
