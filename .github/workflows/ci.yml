name: CI

on:
  push:
  pull_request:

jobs:
  build-and-smoke-test:
    name: Build + headless smoke test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev xvfb

      # Граница RHI: за пределами engine/src/rhi/ вызовов gl* быть не должно.
      # Шаг стоит ДО сборки намеренно — он не требует компилятора и падает за
      # секунду, а не через пять минут, если кто-то дёрнул GL напрямую.
      - name: RHI boundary check (no gl* outside the backend)
        run: python3 scripts/check_rhi_boundary.py

      # Локализация редактора: каждая подпись обёрнута в T(), каждой есть
      # перевод, спецификаторы формата у ключа и перевода совпадают. Тоже до
      # сборки: проверка читает исходники и падает за секунду.
      - name: Localization check (every editor string is translated)
        run: python3 scripts/check_localization.py

      # Пути из окружения: значение переменной становится путём только через
      # sage::EnvPath/EnvString. Одна строка std::getenv("APPDATA") не давала
      # редактору запуститься на русской Windows вообще — fs::path на байтах
      # ANSI бросает исключение. Тоже до сборки: секунда против пяти минут.
      - name: Paths check (no filesystem path taken from getenv)
        run: python3 scripts/check_paths.py

      # Ассеты выбираются слотом, а не набираются путём в поле ввода. Поле с
      # путём не показывает выбранное, не проверяет тип, молчит о пропавшем
      # файле и не принимает перетаскивание — см. editor/src/AssetSlot.h.
      - name: Asset slot check (no asset path typed into a text field)
        run: python3 scripts/check_asset_slots.py

      # Имена всплывающих окон ImGui: OpenPopup и BeginPopup* обязаны совпадать.
      # Разойдутся — окно открыто, но его никто не рисует, а тот, кто его
      # открыл, просит каждый кадр и этим закрывает всё, что открыл человек:
      # ни одно меню и ни один диалог больше не открываются. Снаружи — «редактор
      # завис, кнопки не нажимаются» при живой картинке и пустом логе.
      - name: Popup id check (OpenPopup and BeginPopup* agree on the name)
        run: python3 scripts/check_popup_ids.py

      # Меню объявляют свои отступы: ImGui берёт их в момент BeginPopup, то есть
      # те, что протолкнуты вокруг. Панель с обнулённым WindowPadding отдавала
      # свой ноль любому меню, открытому изнутри неё, — пункты прижимались к
      # самой рамке окна.
      - name: Menu style check (a popup declares its own padding)
        run: python3 scripts/check_menu_style.py

      # Подсказка по скриптовому API для редакторов кода собирается из вызовов
      # Bind(...) движка. Устареет — начнёт врать: предлагать то, чего нет, и
      # молчать о том, что появилось. Врущая подсказка хуже отсутствующей.
      - name: Script API hints are up to date
        run: python3 scripts/gen_script_api.py --check

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # Модульные тесты (математика/сериализация/анимация/ретаргет) — быстрые,
      # без GL. Эталонные кадры исключены: им нужен графический контекст, и
      # гоняются они отдельным шагом под xvfb.
      - name: Unit tests (math/serialization/animation)
        run: ctest --test-dir build --output-on-failure -E sage_render_tests

      # Эталонные кадры: сцена рисуется в offscreen-буфер и сравнивается с
      # закоммиченными PNG. Единственный тест, который проверяет КАРТИНКУ —
      # ошибку в шейдере не видит больше ничто (см. tests/render).
      - name: Reference frame tests (rendering)
        run: |
          xvfb-run -a --server-args="-screen 0 800x600x24" \
            ./build/tests/render/sage_render_tests --references tests/render/references

      # Sandbox рендерит сцену + Lua-скрипт; SageEditor гоняет свой self-test
      # (проект + сцена + undo/redo + play). См. scripts/ci_smoke_test.sh —
      # тот же скрипт можно запустить локально, чтобы воспроизвести падение CI.
      - name: Headless smoke test (Sandbox + SageEditor self-test)
        run: ./scripts/ci_smoke_test.sh build

  windows-cross-compile:
    name: Cross-compile check (Windows, build-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Configure
        run: |
          cmake -B build-windows \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-windows -j"$(nproc)"
